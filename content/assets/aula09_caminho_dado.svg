<!-- BRIEF: Aula 09 (Arquitetura). Comparacao do caminho do dado. Esquerda, E/S por interrupcao: disco -> controlador de E/S -> CPU (ISR) -> RAM, palavra por palavra, com IRQ do controlador para a CPU. Direita, DMA: disco -> controlador de DMA -> RAM, contornando a CPU; a CPU so programa o DMA no inicio (1) e recebe uma interrupcao no fim do bloco (3). Redesenhada em 2026-11-10: a versao anterior tinha setas soltas, rotulos cobertos e mostrava impressora no lugar do disco que a legenda cita. Fundo: cartao off-white fixo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" role="img"
     font-family="'Comic Sans MS','Comic Neue',cursive"
     aria-label="Dois paineis. Na E/S por interrupcao, o dado sai do disco, passa pelo controlador de E/S, entra na CPU, que executa a ISR, e so entao chega a RAM; o controlador avisa a CPU por IRQ, e isso se repete a cada palavra. No DMA, a CPU programa o controlador de DMA uma vez; o dado vai do disco ao controlador de DMA e dele direto para a RAM, contornando a CPU; no fim do bloco, o DMA manda uma unica interrupcao a CPU.">
  <defs>
    <style>
      .lbl { font-family:'Comic Sans MS','Comic Neue',cursive; }
      text { paint-order:stroke; stroke:#fafaf8; stroke-width:3px; stroke-linejoin:round; }
      text[fill="#ffffff"] { stroke:none; }
    </style>
    <marker id="c-lar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b1541b"/>
    </marker>
    <marker id="c-ver" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d52"/>
    </marker>
    <marker id="c-azu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2778c4"/>
    </marker>
    <marker id="c-rox" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4fb0"/>
    </marker>
  </defs>
  <rect id="fundo-card" x="0" y="0" width="900" height="520" rx="18" fill="#fafaf8"/>

  <text x="450" y="38" text-anchor="middle" class="lbl" font-size="22" font-weight="bold" fill="#1d2057">O que muda é por onde o dado passa</text>
  <path d="M240,48 q105,7 210,3 q105,-4 210,2" fill="none" stroke="#00aa9f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ===== PAINEL ESQUERDO: INTERRUPCAO ===== -->
  <rect x="20" y="64" width="420" height="440" rx="14" fill="none" stroke="#b1541b" stroke-width="2.5"/>
  <text x="230" y="94" text-anchor="middle" class="lbl" font-size="18" font-weight="bold" fill="#b1541b">E/S por interrupção</text>
  <text x="230" y="116" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">a CPU carrega cada palavra</text>

  <rect x="160" y="140" width="140" height="64" rx="12" fill="#e4f0fb" stroke="#2778c4" stroke-width="2.5"/>
  <text x="230" y="167" text-anchor="middle" class="lbl" font-size="18" font-weight="bold" fill="#2778c4">CPU</text>
  <text x="230" y="189" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">roda a ISR</text>

  <rect x="45" y="300" width="120" height="56" rx="10" fill="#f0f3f8" stroke="#1d2057" stroke-width="2"/>
  <text x="105" y="333" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#1d2057">disco</text>
  <rect x="45" y="200" width="120" height="64" rx="10" fill="#f0f3f8" stroke="#1d2057" stroke-width="2"/>
  <text x="105" y="227" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">controlador</text>
  <text x="105" y="246" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">de E/S</text>
  <rect x="300" y="300" width="120" height="56" rx="10" fill="#eaf5ee" stroke="#2e7d52" stroke-width="2.5"/>
  <text x="360" y="333" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#2e7d52">RAM</text>

  <!-- caminho do dado: disco -> controlador -> CPU -> RAM -->
  <line x1="105" y1="300" x2="105" y2="270" stroke="#b1541b" stroke-width="4" marker-end="url(#c-lar)"/>
  <path d="M135,200 C140,180 148,174 156,172" fill="none" stroke="#b1541b" stroke-width="4" marker-end="url(#c-lar)"/>
  <path d="M290,204 C320,230 345,262 355,294" fill="none" stroke="#b1541b" stroke-width="4" marker-end="url(#c-lar)"/>
  <text x="352" y="246" class="lbl" font-size="12" font-weight="bold" fill="#b1541b">dado</text>
  <!-- IRQ -->
  <path d="M165,214 C190,214 198,210 206,206" fill="none" stroke="#7a4fb0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#c-rox)"/>
  <text x="182" y="236" class="lbl" font-size="12" font-weight="bold" fill="#7a4fb0">IRQ</text>

  <text x="230" y="400" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">disco → controlador → CPU → RAM</text>
  <text x="230" y="420" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">uma interrupção a cada palavra</text>
  <rect x="45" y="440" width="370" height="44" rx="10" fill="#fbeee6" stroke="#b1541b" stroke-width="2"/>
  <text x="230" y="467" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#b1541b">o dado passa PELA CPU, palavra por palavra</text>

  <!-- ===== PAINEL DIREITO: DMA ===== -->
  <rect x="460" y="64" width="420" height="440" rx="14" fill="none" stroke="#2e7d52" stroke-width="2.5"/>
  <text x="670" y="94" text-anchor="middle" class="lbl" font-size="18" font-weight="bold" fill="#2e7d52">DMA</text>
  <text x="670" y="116" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">a CPU sai do caminho do dado</text>

  <rect x="600" y="140" width="140" height="64" rx="12" fill="#e4f0fb" stroke="#2778c4" stroke-width="2.5"/>
  <text x="670" y="167" text-anchor="middle" class="lbl" font-size="18" font-weight="bold" fill="#2778c4">CPU</text>
  <text x="670" y="189" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">livre, trabalhando</text>

  <rect x="485" y="300" width="110" height="56" rx="10" fill="#f0f3f8" stroke="#1d2057" stroke-width="2"/>
  <text x="540" y="333" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#1d2057">disco</text>
  <rect x="610" y="292" width="120" height="72" rx="10" fill="#f1ebf8" stroke="#7a4fb0" stroke-width="2.5"/>
  <text x="670" y="322" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#7a4fb0">controlador</text>
  <text x="670" y="341" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#7a4fb0">de DMA</text>
  <rect x="750" y="300" width="110" height="56" rx="10" fill="#eaf5ee" stroke="#2e7d52" stroke-width="2.5"/>
  <text x="805" y="333" text-anchor="middle" class="lbl" font-size="15" font-weight="bold" fill="#2e7d52">RAM</text>

  <!-- 1: CPU programa o DMA -->
  <path d="M640,204 C632,236 636,262 645,286" fill="none" stroke="#2778c4" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#c-azu)"/>
  <circle cx="618" cy="246" r="12" fill="#2778c4"/>
  <text x="618" y="251" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text x="574" y="232" text-anchor="end" class="lbl" font-size="12" fill="#2778c4">programa</text>
  <text x="574" y="248" text-anchor="end" class="lbl" font-size="12" fill="#2778c4">uma vez</text>
  <!-- 2: dado disco -> DMA -> RAM -->
  <line x1="595" y1="328" x2="604" y2="328" stroke="#2e7d52" stroke-width="4" marker-end="url(#c-ver)"/>
  <line x1="730" y1="328" x2="744" y2="328" stroke="#2e7d52" stroke-width="4" marker-end="url(#c-ver)"/>
  <circle cx="670" cy="388" r="12" fill="#2e7d52"/>
  <text x="670" y="393" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text x="670" y="420" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">o bloco inteiro: disco → DMA → RAM</text>
  <!-- 3: interrupcao no fim -->
  <path d="M700,286 C710,262 712,236 702,210" fill="none" stroke="#7a4fb0" stroke-width="2.5" marker-end="url(#c-rox)"/>
  <circle cx="722" cy="246" r="12" fill="#7a4fb0"/>
  <text x="722" y="251" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text x="742" y="232" class="lbl" font-size="12" fill="#7a4fb0">1 interrupção,</text>
  <text x="742" y="248" class="lbl" font-size="12" fill="#7a4fb0">no fim do bloco</text>

  <rect x="485" y="440" width="370" height="44" rx="10" fill="#eaf5ee" stroke="#2e7d52" stroke-width="2"/>
  <text x="670" y="467" text-anchor="middle" class="lbl" font-size="14" font-weight="bold" fill="#2e7d52">o dado contorna a CPU</text>
</svg>
